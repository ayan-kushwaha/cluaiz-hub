name: time
version: 1.0.0
description: 100% offline OS system clock, UTC timestamp, timezone, and locale metadata engine
category: plugin
execution_mode: auto
default_turns: 1
discovery:
  semantic_triggers:
    - "what time is it"
    - "current time"
    - "today's date"
    - "current date"
    - "what day is today"
    - "system clock"
    - "local time"
execution:
  envelope: WASM
  binary_path: logic.wasm
permissions:
  network_access: false
  file_system: none
  max_memory_mb: 16
  max_cpu_time_ms: 500
