name: "cluaiz-search"
version: "0.1.1"
description: "Native Dynamic Library plugin for Cluaiz Engine. Provides VRAM-aware web metasearch."
author: "Cluaiz Technologies"
type: "plugin"

discovery:
  semantic_triggers: ["search", "web", "find", "google", "googler", "serch", "fetch", "lookup"]
  cel_grammar: "use plugin::cluaiz-search -> search(...)"

activation:
  lazy_load: true
  trigger_on: 
    - "on_command:use plugin::cluaiz-search"

permissions:
  max_memory_mb: 256
  max_cpu_time_ms: 5000
  network_access: true
  vram_kv_inject: true
  file_system: "none"
  prefix_caching: true

settings:
  search_api_key: { type: "string", default: "", desc: "API Key for the search provider" }
  search_api_type: { type: "enum", options: ["tavily", "serpapi", "duckduckgo"], default: "tavily", desc: "Select engine" }

system_bindings:
  - "system_booster.think_mode"
  - "system_booster.flash_attention"
  - "system_booster.response_length"

execution:
  envelope: "NATIVE"
  entry_point: "execute_cel"
  payload_format: "MsgPack"
