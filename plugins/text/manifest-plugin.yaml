name: text
version: 1.0.0
description: Deterministic string transformation, regex extraction, hashing, and diffing engine
category: plugin
execution_mode: auto
default_turns: 1
discovery:
  semantic_triggers:
    - "regex extract"
    - "sha256 hash"
    - "base64 encode"
    - "base64 decode"
    - "diff text"
execution:
  envelope: WASM
  binary_path: logic.wasm
permissions:
  network_access: false
  file_system: none
  max_memory_mb: 32
  max_cpu_time_ms: 1000
