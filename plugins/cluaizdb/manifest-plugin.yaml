name: "cluaiz-db"
version: "1.0.0"
description: "Native Muscle for the Cluaiz Neural Database."
author: "Cluaiz Technologies"
type: "plugin"

discovery:
  semantic_triggers: ["database", "cdql", "store", "fetch", "save"]
  cel_grammar: "use plugin::cluaiz-db -> execute(...)"

activation:
  lazy_load: true
  trigger_on: 
    - "on_command:use plugin::cluaiz-db"

permissions:
  max_memory_mb: 256
  max_cpu_time_ms: 5000
  network_access: false
  vram_kv_inject: true
  file_system: "read_write"
  prefix_caching: true

system_bindings:
  - "system_booster.think_mode"
  - "permission.vectorize_user_input"

execution:
  envelope: "NATIVE"
  entry_point: "execute_cel"
  payload_format: "JSON"
