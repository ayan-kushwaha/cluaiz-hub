name: search
version: 1.0.0
description: High performance local workspace documentation and keyword retrieval engine
category: plugin
execution_mode: auto
default_turns: 1
discovery:
  semantic_triggers:
    - "search docs"
    - "find documentation"
    - "search workspace"
    - "lookup keyword"
execution:
  envelope: WASM
  binary_path: logic.wasm
permissions:
  network_access: false
  file_system: read
  max_memory_mb: 64
  max_cpu_time_ms: 2000
