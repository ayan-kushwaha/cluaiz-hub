# =====================================================================
# cluaiz SKILL MANIFEST (manifest-skill.yaml)
# =====================================================================
name: "learn-cluaiz"
version: "1.0.0"
description: "Technical tutorial and architecture guide for the Cluaiz ecosystem."
author: "Aryan"
type: "skill"

discovery:
  semantic_triggers:
    - "learn cluaiz"
    - "what is cluaiz"
    - "how does cluaiz work"
    - "cluaiz architecture"
    - "explain cel"
    - "explain tools in cluaiz"
  brain_manual: "SKILL.md"

dependencies:
  plugins: []
  mcp: []

permissions:
  filesystem: true
  network: false
  level: "ReadOnly"

execution:
  execution_mode: "auto"
  default_turns: 3
