# =====================================================================
# cluaiz PLUGIN MANIFEST (manifest-plugin.yaml)
#
# PURPOSE: Configures a "Plugin" which is pure muscle (compiled WASM/C++).
# A plugin has NO `SKILL.md` (no AI prompt). It executes blindly when called.
# =====================================================================

# [FIXED SCHEMA] The exact unique name of this plugin in the ecosystem. 
# Dynamic Value Example: "math", "text", "search", "time", "sysinfo"
name: "math"

# [FIXED SCHEMA] Semantic versioning for updates.
# Dynamic Value Example: "1.0.0", "2.1.3"
version: "1.0.0"

# [FIXED SCHEMA] Short human-readable description.
description: "Deterministic high-precision arithmetic, calculus, and mathematical evaluator."

# [FIXED SCHEMA] Name of the creator or organization.
author: "Aryan"

# [FIXED SCHEMA] Must be exactly "plugin" to tell Engine how to load this.
type: "plugin"

# ---------------------------------------------------------------------
# NEW SCHEMA (Used by CEL AI Router - inference-cel)
# This is the engine system that tells the AI when to use the tool.
# ---------------------------------------------------------------------
discovery:
  # [FIXED SCHEMA] Keywords that will be injected into the AI's prompt. 
  semantic_triggers: 
    - "calculate"
    - "math"
    - "solve equation"
    - "trigonometry"
    - "evaluate math"
  
  # [FIXED SCHEMA] CEL grammar invocation pattern
  cel_grammar: "use plugin::math -> evaluate(...)"

activation:
  # [FIXED SCHEMA] True = Engine will only load this into RAM when needed.
  lazy_load: true
  
  # [FIXED SCHEMA] List of event strings that trigger the Engine to load this plugin.
  trigger_on: 
    - "on_command:use plugin::math"

permissions:
  # [OPTIONAL] Hard RAM limit (in MB). The Engine will OOM kill the WASM if exceeded via ResourceLimiter.
  max_memory_mb: 16
  
  # [OPTIONAL] Max CPU execution time (ms) enforced via fuel counters.
  max_cpu_time_ms: 500
  
  # [FIXED SCHEMA] True/False. Whether HTTP calls are allowed in the WASM sandbox.
  network_access: false
  
  # [FIXED SCHEMA] True/False. Can this plugin inject data directly into the AI's memory (KV cache)?
  vram_kv_inject: false
  
  # [FIXED SCHEMA] Prefix caching control.
  prefix_caching: false
  
  # [FIXED SCHEMA] Disk access: "none", "read_only", "read_write"
  file_system: "none"

# ---------------------------------------------------------------------
# SYSTEM BINDINGS (Dynamic Hardware & Booster State)
# ---------------------------------------------------------------------
system_bindings: []

# ---------------------------------------------------------------------
# CONFIGURATION SETTINGS
# ---------------------------------------------------------------------
settings:
  precision: { type: "number", default: 10, desc: "Decimal precision for floating point evaluation" }
  mode: { type: "enum", options: ["standard", "scientific"], default: "standard", desc: "Calculation mode" }

# ---------------------------------------------------------------------
# EXECUTION (In-Process WASM / Native Envelope)
# ---------------------------------------------------------------------
execution:
  # [FIXED SCHEMA] Sandbox type: "WASM" (Strict limits) or "NATIVE" (C-FFI).
  envelope: "WASM"
  
  # [FIXED SCHEMA] Path to the compiled WebAssembly binary.
  binary_path: "logic.wasm"
  
  # [FIXED SCHEMA] The exported C-language function name called by the engine.
  entry_point: "execute_cel"
  
  # [FIXED SCHEMA] Data serialization: "MsgPack" or "JSON".
  payload_format: "MsgPack"

execution_mode: "auto"
default_turns: 1
