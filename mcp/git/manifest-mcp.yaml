name: git
version: 1.0.0
description: Official Model Context Protocol Git repository inspection and diff analysis bridge
category: mcp
execution_mode: manual
default_turns: 0
discovery:
  semantic_triggers:
    - "git status"
    - "git diff"
    - "git log"
    - "git history"
execution:
  command: npx
  args:
    - "-y"
    - "@modelcontextprotocol/server-git"
permissions:
  network_access: false
  file_system: read
