name: context7
version: 1.0.0
description: Version-specific live library documentation and API reference lookup engine
category: mcp
execution_mode: manual
default_turns: 0
discovery:
  semantic_triggers:
    - "lookup docs"
    - "library reference"
    - "api docs"
    - "context7 lookup"
execution:
  command: npx
  args:
    - "-y"
    - "@upstash/context7-mcp"
permissions:
  network_access: true
  file_system: none
