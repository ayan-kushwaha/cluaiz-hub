name: everything
version: 1.0.0
description: Official Model Context Protocol reference test server exercising all MCP capabilities
category: mcp
execution_mode: manual
default_turns: 0
discovery:
  semantic_triggers:
    - "test mcp"
    - "mcp protocol test"
    - "everything server"
execution:
  command: npx
  args:
    - "-y"
    - "@modelcontextprotocol/server-everything"
permissions:
  network_access: true
  file_system: none
