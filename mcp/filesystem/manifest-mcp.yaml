name: filesystem
version: 1.0.0
description: Official Model Context Protocol secure file system bridge
category: mcp
execution_mode: manual
default_turns: 0
discovery:
  semantic_triggers:
    - "read file"
    - "write file"
    - "list files"
    - "directory tree"
execution:
  command: npx
  args:
    - "-y"
    - "@modelcontextprotocol/server-filesystem"
    - "."
permissions:
  network_access: false
  file_system: read-write
