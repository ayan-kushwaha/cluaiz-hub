name: "cluaiz-search"
version: "1.0.0"
description: "Native Dynamic Library extension for cluaiz Engine. Provides VRAM-aware web metasearch."
author: "Cluaiz Technologies"
type: "extension"

discovery:
  semantic_triggers: ["search", "web", "find"]
  cel_grammar: "use extension::cluaiz-search -> search(...)"

activation:
  lazy_load: true
  trigger_on: 
    - "on_command:use extension::cluaiz-search"

permissions:
  max_memory_mb: 256
  max_cpu_time_ms: 5000
  network_access: true
  vram_kv_inject: true
  file_system: "none"
  mid_layer_jit_injection: true

settings:
  search_api_key: { type: "string", default: "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", desc: "API Key for the search provider" }
  search_api_type: { type: "enum", options: ["tavily", "serpapi", "duckduckgo"], default: "tavily", desc: "Select engine" }


system_bindings:
  - "system_booster.think_mode"
  - "system_booster.flash_attention"
  - "system_booster.response_length"

execution:
  envelope: "NATIVE"
  entry_point: "execute_cel"
  payload_format: "MsgPack"
